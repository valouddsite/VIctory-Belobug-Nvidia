name: Windows test package

on:
  workflow_dispatch:
  push:
    branches: [release/rtx-5060-test, a-publier]

permissions:
  contents: read

concurrency:
  group: windows-test-package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Версия NuGet-пакета Microsoft.Direct3D.D3D12. Должна соответствовать
  # SDK-версии, которую agility.rs передаёт в CreateDeviceFactory
  # (1.614.x -> 614, 1.616.x -> 616, и т.д.).
  AGILITY_NUGET_VERSION: 1.616.1

jobs:
  package:
    name: Build Windows x64 test package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Build optimized Windows executable
        run: cargo build --locked --release -p victory

      - name: Fetch D3D12 Agility SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:AGILITY_NUGET_VERSION
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Direct3D.D3D12/$ver" -OutFile agility.zip
          Expand-Archive agility.zip -DestinationPath agility -Force
          New-Item -ItemType Directory -Force -Path dist-agility | Out-Null
          $bin = 'agility/build/native/bin/x64'
          foreach ($f in @('D3D12Core.dll', 'd3d12SDKLayers.dll')) {
            if (-not (Test-Path (Join-Path $bin $f))) { throw "Agility SDK file missing in NuGet package: $f" }
            Copy-Item (Join-Path $bin $f) dist-agility/
          }
          Get-ChildItem dist-agility | Format-Table Name, Length

      - name: Assemble test package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'dist/VIctory-RTX5060-Windows-x64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'target/release/victory.exe' $package
          Copy-Item 'victory.example.toml' $package
          Copy-Item 'VIctory-Launcher.cmd' $package
          New-Item -ItemType Directory -Force -Path "$package/scripts" | Out-Null
          Copy-Item 'scripts/play.ps1' "$package/scripts/"
          Copy-Item 'scripts/launcher.ps1' "$package/scripts/"
          # D3D12 Agility SDK: agility.rs ищет D3D12Core.dll в <exe dir>\D3D12
          New-Item -ItemType Directory -Force -Path "$package/D3D12" | Out-Null
          Copy-Item 'dist-agility/*' "$package/D3D12/"
          # Catch PowerShell syntax errors and verify the packaged binary layout.
          foreach ($script in @('scripts/play.ps1', 'scripts/launcher.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $package $script), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "Packaged script $script has PowerShell parse errors: $($parseErrors -join '; ')" }
          }
          foreach ($required in @('victory.exe', 'VIctory-Launcher.cmd', 'victory.example.toml', 'scripts/play.ps1', 'scripts/launcher.ps1', 'D3D12/D3D12Core.dll')) {
            if (-not (Test-Path (Join-Path $package $required))) { throw "Required package file is missing: $required" }
          }
          @'
          VIctory - NVIDIA RTX 5060 test package

          This is an experimental Windows x64 build. It is not a validated RTX 5060 release.
          Requirements: Windows 10/11 x64, AVX2 CPU, Direct3D 12 GPU with Shader Model 6.6
          and mesh-shader support, current NVIDIA driver, and the MSVC runtime/build dependencies
          required by the project.

          WINDOWS 10
          The D3D12 folder next to victory.exe holds the Microsoft D3D12 Agility SDK runtime.
          It lets Windows 10 22H2 (with update KB5029331 or newer) use Shader Model 6.6 and
          mesh shaders. Keep the folder next to victory.exe. Without the update, the game
          falls back to the inbox D3D12 (no mesh shaders). The log shows which one was used.

          QUICK START
          1. Extract this folder somewhere writable.
          2. Double-click VIctory-Launcher.cmd.
          3. Select your own legally obtained game executable in the file picker.
          4. Choose the normal or safe profile. The launcher creates victory.toml if needed,
             passes the selected game folder for this session, checks the configuration,
             and writes a diagnostic log under logs/.

          Manual alternative:
          .\scripts\play.ps1 -Exe "D:\path\to\your\game.exe" -Build release

          Start with the safe profile if rendering or stability problems occur:
             .\scripts\play.ps1 -Exe "D:\path\to\your\game.exe" -Build release -Safe

          Keep your game files outside this package. No game files or proprietary assets are included.
          Back up saves before testing. Do not run PowerShell as Administrator.
          Report the GPU/driver, game build, settings, log and exact reproduction steps when reporting
          a problem. Do not share game files, keys, or personal data.

          This build has passed automated Windows CI only. Actual RTX 5060 rendering, stability,
          VRAM use and frame rate must be tested on physical hardware.
          '@ | Set-Content -Encoding utf8 "$package/TEST-ON-YOUR-PC.txt"
          Compress-Archive -Path "$package/*" -DestinationPath 'dist/VIctory-RTX5060-Windows-x64.zip' -Force
          if (-not (Test-Path 'dist/VIctory-RTX5060-Windows-x64.zip')) { throw 'Package ZIP was not created.' }

      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: VIctory-RTX5060-Windows-x64
          path: dist/VIctory-RTX5060-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
